apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp
  namespace: ivolve
  labels:
    app: demoapp
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: demoapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      # The pipeline creates this secret from the "dockerhub" credential, so
      # a private Docker Hub repository works as well as a public one.
      imagePullSecrets:
        - name: dockerhub
      # Lets the pod run on a single-node kubeadm cluster whose control
      # plane still carries the NoSchedule taint.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: demoapp
          # The pipeline rewrites this line with the tag it just pushed.
          image: DOCKERHUB_USER/demoapp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
